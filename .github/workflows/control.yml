name: lab-control
on:
  pull_request:
    branches: [main]
    paths: ['control/**', '.github/workflows/control.yml']
  push:
    branches: [main]
    paths: ['control/**', '.github/workflows/control.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-images-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        tier: [k8s, agent, docker, linux, dev]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        arch: [amd64, arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: control
          target: ${{ matrix.tier }}
          load: true
          tags: control-test:${{ matrix.tier }}
          cache-from: type=gha,scope=control-${{ matrix.tier }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=control-${{ matrix.tier }}-${{ matrix.arch }}
      - name: Smoke test backend security contract
        env:
          TIER: ${{ matrix.tier }}
        run: |
          docker run --rm --read-only --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            "control-test:$TIER" control-smoke "$TIER"
      - name: Authenticate for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TIER: ${{ matrix.tier }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/epr-consulting/lab-control:$TIER-$GITHUB_SHA-$ARCH"
          docker tag "control-test:$TIER" "$image"
          docker push "$image"
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble tested multi-platform releases
        run: |
          for tier in k8s agent docker linux dev; do
            image="ghcr.io/epr-consulting/lab-control:$tier-$GITHUB_SHA"
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
            docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
          done
