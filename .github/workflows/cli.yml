name: lab-cli
on:
  pull_request:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-images-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cli
          target: cli
          load: true
          tags: cli-test:latest
          cache-from: type=gha,scope=cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cli-${{ matrix.arch }}
      - name: Smoke test the extracted binaries
        run: |
          dir="$RUNNER_TEMP/cli"
          mkdir -p "$dir"
          container=$(docker create cli-test:latest /vcluster)
          docker cp "$container:/vcluster" "$dir/vcluster"
          docker cp "$container:/helm" "$dir/helm"
          docker rm "$container"
          sh cli/smoke.sh "$dir"
      - name: Authenticate for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/epr-consulting/lab-cli:$GITHUB_SHA-$ARCH"
          docker tag cli-test:latest "$image"
          docker push "$image"
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the tested multi-platform release
        run: |
          image="ghcr.io/epr-consulting/lab-cli:$GITHUB_SHA"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
