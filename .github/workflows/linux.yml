name: lab-linux
on:
  pull_request:
    branches: [main]
    paths:
      - 'linux/**'
      - 'control/history.bash'
      - '.github/workflows/linux.yml'
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - 'control/history.bash'
      - '.github/workflows/linux.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-images-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        tier: [basic]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        arch: [amd64, arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: linux
          build-contexts: shell=control
          target: ${{ matrix.tier }}
          load: true
          tags: linux-test:${{ matrix.tier }}
          cache-from: type=gha,scope=linux-${{ matrix.tier }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.tier }}-${{ matrix.arch }}
      # The Pod's command is "tini -- sleep infinity". The image starts the same
      # way, runs as root, and has no volume and no port.
      - name: Check the image's configuration
        env:
          TIER: ${{ matrix.tier }}
        run: |
          config=$(docker image inspect --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}} {{json .Config.Volumes}} {{json .Config.ExposedPorts}} {{json .Config.User}}' "linux-test:$TIER")
          echo "$config"
          test "$config" = '["/usr/bin/tini","--"] ["sleep","infinity"] null null ""'
      # The Pod's contract: root, Docker's default capabilities (which lack
      # SYS_ADMIN, as the Pod's do) and no network. The runner's Docker does not
      # remap user namespaces and stays as it is: the Pod's hostUsers: false
      # changes who root is on the node, not the image.
      - name: Smoke test the Pod's contract
        env:
          TIER: ${{ matrix.tier }}
        run: docker run --rm --network none "linux-test:$TIER" linux-smoke
      # The five capabilities useradd, su, sudo and cron need. Without NET_RAW,
      # ping cannot start, and the test skips it.
      - name: Smoke test with the five capabilities
        env:
          TIER: ${{ matrix.tier }}
        run: |
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN \
            --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            "linux-test:$TIER" linux-smoke
      - name: Authenticate for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TIER: ${{ matrix.tier }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/epr-consulting/lab-linux:$TIER-$GITHUB_SHA-$ARCH"
          docker tag "linux-test:$TIER" "$image"
          docker push "$image"
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble tested multi-platform releases
        run: |
          for tier in basic; do
            image="ghcr.io/epr-consulting/lab-linux:$tier-$GITHUB_SHA"
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
            docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
          done
